:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
  --sea:#5cc0dd;
  --panel:#fffaf0;
  --panel-edge:#b7773f;
  --ink:#4a2e17;
  --ink-soft:#8a6545;
  --leaf:#4f9a2b;
  --leaf-dark:#3a7a1d;
  --berry:#e2483d;
  --butter:#ffd257;
  --chip:#f3e6cc;
  --shade:rgba(40,25,10,.35);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --panel:#2d2219;
    --panel-edge:#8a5a30;
    --ink:#fbeedd;
    --ink-soft:#d2b896;
    --chip:#3d2f22;
    --shade:rgba(0,0,0,.55);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --panel:#2d2219;--panel-edge:#8a5a30;--ink:#fbeedd;--ink-soft:#d2b896;--chip:#3d2f22;--shade:rgba(0,0,0,.55);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:var(--sea);
  font-family:"Fredoka","Trebuchet MS","Segoe UI",system-ui,sans-serif;color:var(--ink);
  -webkit-user-select:none;user-select:none;touch-action:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}

/* HUD */
.hud{position:fixed;top:0;left:0;right:0;padding:calc(env(safe-area-inset-top,0px) + 10px) 12px 0;
  display:flex;justify-content:space-between;align-items:center;pointer-events:none;z-index:5}
.lvl{display:flex;align-items:center;gap:0;pointer-events:auto}
.star{width:46px;height:46px;position:relative;z-index:2;display:grid;place-items:center;
  font-weight:700;font-size:19px;color:#fff;text-shadow:0 2px 0 #1d5fa8}
.star img{position:absolute;left:-4px;top:-4px;width:54px;height:54px;object-fit:contain}
.star span{position:relative}
.xpbar{width:110px;height:20px;margin-left:-14px;background:rgba(30,30,40,.55);border-radius:0 10px 10px 0;overflow:hidden;
  border:2px solid rgba(255,255,255,.7);border-left:none}
.xpbar i{display:block;height:100%;width:0;background:linear-gradient(#7fd3ff,#2d8fe0);transition:width .4s}
.coins{pointer-events:auto;display:flex;align-items:center;gap:6px;background:rgba(30,30,40,.55);
  border:2px solid rgba(255,255,255,.7);border-radius:14px;padding:3px 12px 3px 4px;color:#fff;font-weight:600;font-size:18px}
.coinimg{width:30px;height:30px;object-fit:contain;margin:-2px 0}

.dock{position:fixed;left:0;right:0;bottom:0;padding:0 14px calc(env(safe-area-inset-bottom,0px) + 14px);
  display:flex;justify-content:space-between;align-items:flex-end;pointer-events:none;z-index:5}
.dock .right{display:flex;gap:10px}
.btn-round{pointer-events:auto;width:64px;height:64px;border-radius:18px;border:none;position:relative;
  background:linear-gradient(#fffdf6,#f1dfbd);box-shadow:0 4px 0 #b98a52,0 6px 10px rgba(0,0,0,.25);
  font-size:30px;display:grid;place-items:center;cursor:pointer;color:#4a2e17;font-family:inherit}
.btn-round img{width:44px;height:44px;object-fit:contain;pointer-events:none}
.btn-round small{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-size:12px;font-weight:600;
  color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.6);white-space:nowrap}
.btn-round:active{transform:translateY(3px);box-shadow:0 1px 0 #b98a52,0 2px 4px rgba(0,0,0,.25)}
.btn-round:focus-visible,.btn:focus-visible,.x:focus-visible{outline:3px solid #fff;outline-offset:2px}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:var(--berry);
  color:#fff;font-size:13px;font-weight:700;display:none;place-items:center;padding:0 5px;border:2px solid #fff}
.badge.on{display:grid}

.place-bar{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 20px);transform:translateX(-50%);
  display:none;gap:14px;z-index:6}
.place-bar.on{display:flex}

/* sheet */
.veil{position:fixed;inset:0;background:var(--shade);z-index:10;display:none}
.veil.on{display:block}
.sheet{position:fixed;left:50%;bottom:0;transform:translate(-50%,105%);width:min(520px,100%);
  max-height:78%;overflow:auto;z-index:11;background:var(--panel);border-radius:22px 22px 0 0;
  border:4px solid var(--panel-edge);border-bottom:none;padding:0 16px calc(env(safe-area-inset-bottom,0px) + 18px);
  transition:transform .25s ease}
.sheet.on{transform:translate(-50%,0)}
.sheet header{position:sticky;top:0;background:var(--panel);display:flex;align-items:center;justify-content:space-between;
  padding:14px 0 10px;z-index:1}
.sheet h2{margin:0;font-size:22px;font-weight:700}
.x{width:38px;height:38px;border-radius:50%;border:none;background:var(--berry);color:#fff;font-size:20px;font-weight:700;
  box-shadow:0 3px 0 #a52b22;cursor:pointer;font-family:inherit}
.sub{margin:-4px 0 12px;color:var(--ink-soft);font-size:15px}
.row{display:flex;align-items:center;gap:12px;background:var(--chip);border-radius:16px;padding:10px 12px;margin-bottom:10px}
.row .ico{font-size:34px;width:48px;text-align:center;flex:none}
.row .ico img{width:56px;display:block}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;font-size:17px}
.row .d{font-size:14px;color:var(--ink-soft)}
.ic{width:1.35em;height:1.35em;object-fit:contain;vertical-align:-.32em}
.row .ico .ic{width:44px;height:44px}
.inv b .ic{width:48px;height:48px}
.order .it .ic{width:34px;height:34px}
.need{display:inline-flex;align-items:center;gap:2px;margin-right:8px;font-size:15px;font-weight:600}
.need.miss{color:var(--berry)}
.btn{border:none;border-radius:14px;padding:10px 14px;font-family:inherit;font-weight:700;font-size:16px;cursor:pointer;
  background:linear-gradient(#8fd64f,var(--leaf));color:#fff;box-shadow:0 3px 0 var(--leaf-dark);text-shadow:0 1px 0 rgba(0,0,0,.25);
  white-space:nowrap}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--leaf-dark)}
.btn[disabled]{filter:none;opacity:.6;background:linear-gradient(#c8beb0,#a89e91);box-shadow:0 3px 0 #82796d;color:#fff;text-shadow:none}
.btn.alt{background:linear-gradient(#ffe48a,#f2b632);color:#5a3a00;box-shadow:0 3px 0 #b9821a;text-shadow:none}
.btn.ghost{background:transparent;color:var(--ink-soft);box-shadow:none;text-shadow:none;padding:8px}
.prog{height:12px;border-radius:6px;background:rgba(0,0,0,.12);overflow:hidden;margin-top:6px}
.prog i{display:block;height:100%;background:linear-gradient(90deg,#ffd257,#f39b1c)}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:10px}
.inv div{background:var(--chip);border-radius:16px;text-align:center;padding:10px 4px}
.inv b{display:block;font-size:34px}
.inv span{font-weight:600}
.cap{margin:4px 0 14px}
.orders{display:grid;gap:10px}
.order{background:var(--chip);border-radius:16px;padding:12px}
.order .items{display:flex;flex-wrap:wrap;gap:6px 12px;margin-bottom:10px}
.order .it{font-size:24px;display:flex;align-items:center;gap:3px}
.order .it em{font-style:normal;font-size:15px;font-weight:600}
.order .it em.miss{color:var(--berry)}
.order .foot{display:flex;align-items:center;justify-content:space-between;gap:8px}
.reward{font-weight:600;font-size:16px}

.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 70px);transform:translate(-50%,-10px);opacity:0;
  background:rgba(40,28,15,.85);color:#fff;padding:9px 16px;border-radius:14px;font-weight:600;font-size:16px;z-index:20;
  transition:opacity .2s,transform .2s;pointer-events:none;max-width:88%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){.sheet,.toast,.xpbar i{transition:none}}
</style>
<style>
.hud{align-items:flex-start}
.hud .lvl{margin-top:2px}
#o2Pill.low,#shPill.low{background:rgba(190,40,30,.85);animation:pulse 1.2s infinite}
.travelbtn{position:fixed;left:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 112px);z-index:7;width:58px;height:58px;border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 30% 30%,#6a5cff,#24145e);color:#fff;font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.25),0 0 18px rgba(120,100,255,.6);pointer-events:auto}
.spacefx{position:fixed;inset:0;z-index:40;display:none;overflow:hidden;pointer-events:none}.spacefx.on{display:block;pointer-events:auto}
.sfx-sky{position:absolute;inset:0;background:radial-gradient(ellipse at 50% 120%,#3b1a5c,#0b0f2e 60%,#02030b);}
.sfx-sky::after{content:"";position:absolute;inset:0;background-image:radial-gradient(2px 2px at 20% 30%,#fff,transparent),radial-gradient(2px 2px at 70% 20%,#fff,transparent),radial-gradient(1px 1px at 40% 70%,#fff,transparent),radial-gradient(2px 2px at 85% 60%,#9ff3ff,transparent),radial-gradient(1px 1px at 10% 85%,#fff,transparent),radial-gradient(1px 1px at 55% 45%,#fff,transparent);}
.sfx-rocket{position:absolute;left:50%;bottom:-10%;transform:translateX(-50%);width:min(60vw,320px);animation:sfxUp 2.4s ease-in forwards}.sfx-rocket img,.sfx-fly img,.sfx-land img{width:100%;display:block}
@keyframes sfxUp{0%{transform:translate(-50%,0)}15%{transform:translate(-50%,-2%) rotate(-1deg)}25%{transform:translate(-50%,-2%) rotate(1deg)}100%{transform:translate(-50%,-140vh)}}
.sfx-fly{position:absolute;top:35%;left:-60vw;width:min(70vw,420px);animation:sfxFly 1.5s ease-in-out forwards}.sfx-fly.late{animation-delay:2.2s;left:-80vw}
@keyframes sfxFly{to{left:120vw}}
.sfx-land{position:absolute;left:50%;top:-40%;transform:translateX(-50%);width:min(55vw,300px);animation:sfxLand 2s ease-out 3.9s forwards}
@keyframes sfxLand{to{top:38%}}
#powPill.low{background:rgba(190,40,30,.85);animation:pulse 1.2s infinite}
.pop{pointer-events:auto;display:flex;align-items:center;gap:4px;background:rgba(30,30,40,.55);border:2px solid rgba(255,255,255,.7);
  border-radius:14px;padding:2px 10px 2px 2px;color:#fff;font-weight:600;font-size:15px;margin-top:6px}
.pop img{width:26px;height:26px;object-fit:contain}
.hud .rightcol{display:flex;flex-direction:column;align-items:flex-end}
.talk{position:fixed;left:10px;right:10px;bottom:calc(env(safe-area-inset-bottom,0px) + 104px);z-index:8;display:none;
  align-items:flex-end;gap:6px;max-width:520px;margin:0 auto}
.talk.on{display:flex}
.talk img{width:86px;height:86px;object-fit:contain;flex:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.3))}
.talk .bub{flex:1;background:var(--panel);border:3px solid var(--panel-edge);border-radius:18px 18px 18px 4px;padding:10px 12px;
  box-shadow:0 6px 14px rgba(0,0,0,.25)}
